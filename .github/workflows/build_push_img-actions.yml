name: Build and Push

on:
  push:
    branches:
      - main

permissions:
    contents: read
    packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd src
          pytest addition.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
    
      - name: Verify
        run: echo $SHORT_SHA

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          #tags: ghcr.io/${{ github.repository }}:latest
          tags: |
            ghcr.io/setonjay/github-actions-zero-to-hero:latest
            ghcr.io/setonjay/github-actions-zero-to-hero:${{ github.ref_name }}
            ghcr.io/setonjay/github-actions-zero-to-hero:${{ env.SHORT_SHA }}